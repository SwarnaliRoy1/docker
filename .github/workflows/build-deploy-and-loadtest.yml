name: Docker-Kubernetes CI/CD (Build + Push + Deploy + Load Test + CML Report)

on:
  push:
    branches: [ "week7" ]
  pull_request:
    branches: [ "week7" ]
  workflow_dispatch:
    inputs:
      duration:
        description: "wrk duration (e.g. 60s, 5m)"
        required: true
        default: "60s"
      conc1:
        description: "Concurrency for autoscale test"
        required: true
        default: "1000"
      conc2:
        description: "Concurrency for no-scale test"
        required: true
        default: "2000"

# Needed so CML can publish a comment
permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  GAR_LOCATION: us-central1
  GAR_REPO: my-repo
  IMAGE_NAME: iris-api
  GKE_CLUSTER: week7-log-ml-cluster
  GKE_LOCATION: us-central1-a
  NAMESPACE: default

jobs:
  deploy-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- Auth & gcloud ----
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}

      - name: Install gcloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: 'gke-gcloud-auth-plugin'

      # ---- Build & push ----
      - name: Configure Docker for GAR
        run: gcloud auth configure-docker ${GAR_LOCATION}-docker.pkg.dev -q

      - name: Compute image uri + tag
        id: meta
        env:
          GOOGLE_PROJECT: ${{ secrets.GOOGLE_PROJECT }}
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          IMAGE_URI="${{ env.GAR_LOCATION }}-docker.pkg.dev/${GOOGLE_PROJECT}/${{ env.GAR_REPO }}/${{ env.IMAGE_NAME }}"
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "image_uri=${IMAGE_URI}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build \
            -t "${{ steps.meta.outputs.image_uri }}:${{ steps.meta.outputs.short_sha }}" \
            -t "${{ steps.meta.outputs.image_uri }}:latest" .

      - name: Push Docker image
        run: |
          docker push "${{ steps.meta.outputs.image_uri }}:${{ steps.meta.outputs.short_sha }}"
          docker push "${{ steps.meta.outputs.image_uri }}:latest"

      # ---- Deploy ----
      - name: Get GKE credentials
        env:
          GOOGLE_PROJECT: ${{ secrets.GOOGLE_PROJECT }}
        run: |
          gcloud container clusters get-credentials "${{ env.GKE_CLUSTER }}" \
            --zone "${{ env.GKE_LOCATION }}" --project "$GOOGLE_PROJECT"

      - name: Apply K8s manifests
        env:
          GOOGLE_PROJECT: ${{ secrets.GOOGLE_PROJECT }}
        run: |
          sed "s/GOOGLE_PROJECT/${GOOGLE_PROJECT}/g" deployment.yaml | kubectl -n "${{ env.NAMESPACE }}" apply -f -

      - name: Set Deployment image to new tag
        run: |
          kubectl -n "${{ env.NAMESPACE }}" set image deployment/iris-api iris-api="${{ steps.meta.outputs.image_uri }}:${{ steps.meta.outputs.short_sha }}"

      - name: Wait for rollout
        run: |
          kubectl -n "${{ env.NAMESPACE }}" rollout status deployment/iris-api --timeout=300s

      - name: Get Service external IP
        id: getip
        run: |
          for i in {1..30}; do
            IP=$(kubectl -n "${{ env.NAMESPACE }}" get svc iris-api -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
            if [ -n "$IP" ]; then
              echo "service_ip=$IP" >> $GITHUB_OUTPUT
              echo "Service IP: $IP"
              exit 0
            fi
            echo "Waiting for LoadBalancer IP..."
            sleep 10
          done
          echo "LoadBalancer IP not assigned in time" >&2
          exit 1

      # ---- Load tests (uses your post.lua) ----
      - name: Install wrk
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk

      - name: Ensure post.lua exists
        run: |
          test -f post.lua || (echo "post.lua not found at repo root" && exit 1)

      - name: Enable HPA autoscaling (min=1 max=3)
        run: |
          kubectl -n "${{ env.NAMESPACE }}" patch hpa iris-api-hpa --type merge -p '{"spec":{"minReplicas":1,"maxReplicas":3}}' || true
          kubectl -n "${{ env.NAMESPACE }}" get hpa

      - name: Load test with autoscaling ON
        env:
          SERVICE_IP: ${{ steps.getip.outputs.service_ip }}
          DURATION: ${{ github.event.inputs.duration || '60s' }}
          CONCURRENCY: ${{ github.event.inputs.conc1 || '1000' }}
        run: |
          wrk -t4 -c${CONCURRENCY} -d${DURATION} --latency -s post.lua http://${SERVICE_IP}:80 | tee wrk_autoscale.txt
          kubectl -n "${{ env.NAMESPACE }}" get hpa iris-api-hpa -o wide | tee hpa_after_autoscale.txt
          kubectl -n "${{ env.NAMESPACE }}" get pods -o wide | tee pods_after_autoscale.txt

      - name: Restrict HPA to 1 pod (min=1 max=1)
        run: |
          kubectl -n "${{ env.NAMESPACE }}" patch hpa iris-api-hpa --type merge -p '{"spec":{"minReplicas":1,"maxReplicas":1}}' || true
          kubectl -n "${{ env.NAMESPACE }}" get hpa

      - name: Load test no-scale (c=${{ github.event.inputs.conc1 || '1000' }})
        env:
          SERVICE_IP: ${{ steps.getip.outputs.service_ip }}
          DURATION: ${{ github.event.inputs.duration || '60s' }}
          CONCURRENCY1: ${{ github.event.inputs.conc1 || '1000' }}
        run: |
          wrk -t4 -c${CONCURRENCY1} -d${DURATION} --latency -s post.lua http://${SERVICE_IP}:80 | tee wrk_noscale_c${CONCURRENCY1}.txt
          kubectl -n "${{ env.NAMESPACE }}" get hpa iris-api-hpa -o wide | tee hpa_after_noscale_c${CONCURRENCY1}.txt
          kubectl -n "${{ env.NAMESPACE }}" get pods -o wide | tee pods_after_noscale_c${CONCURRENCY1}.txt

      - name: Load test no-scale (c=${{ github.event.inputs.conc2 || '2000' }})
        env:
          SERVICE_IP: ${{ steps.getip.outputs.service_ip }}
          DURATION: ${{ github.event.inputs.duration || '60s' }}
          CONCURRENCY2: ${{ github.event.inputs.conc2 || '2000' }}
        run: |
          wrk -t4 -c${CONCURRENCY2} -d${DURATION} --latency -s post.lua http://${SERVICE_IP}:80 | tee wrk_noscale_c${CONCURRENCY2}.txt
          kubectl -n "${{ env.NAMESPACE }}" get hpa iris-api-hpa -o wide | tee hpa_after_noscale_c${CONCURRENCY2}.txt
          kubectl -n "${{ env.NAMESPACE }}" get pods -o wide | tee pods_after_noscale_c${CONCURRENCY2}.txt

      # ---- CML report (publish) ----
      - name: Set up CML
        uses: iterative/setup-cml@v2

      - name: Build CML report
        id: cmlreport
        env:
          SERVICE_IP: ${{ steps.getip.outputs.service_ip }}
          IMAGE_URI: ${{ steps.meta.outputs.image_uri }}
          IMG_TAG: ${{ steps.meta.outputs.short_sha }}
          DURATION: ${{ github.event.inputs.duration || '60s' }}
          CONCURRENCY1: ${{ github.event.inputs.conc1 || '1000' }}
          CONCURRENCY2: ${{ github.event.inputs.conc2 || '2000' }}
        run: |
          get_rps() { grep -E "Requests/sec" "$1" | awk '{print $2}'; }
          get_p50() { grep -E "^\s*50%" "$1" | awk '{print $2}'; }
          get_p90() { grep -E "^\s*90%" "$1" | awk '{print $2}'; }
          get_timeouts() { grep -E "timeout" "$1" | awk '{print $2}'; }

          RPS_AUTO=$(get_rps wrk_autoscale.txt)
          P50_AUTO=$(get_p50 wrk_autoscale.txt)
          P90_AUTO=$(get_p90 wrk_autoscale.txt)
          TO_AUTO=$(get_timeouts wrk_autoscale.txt)

          RPS_NO1=$(get_rps wrk_noscale_c${CONCURRENCY1}.txt)
          P50_NO1=$(get_p50 wrk_noscale_c${CONCURRENCY1}.txt)
          P90_NO1=$(get_p90 wrk_noscale_c${CONCURRENCY1}.txt)
          TO_NO1=$(get_timeouts wrk_noscale_c${CONCURRENCY1}.txt)

          RPS_NO2=$(get_rps wrk_noscale_c${CONCURRENCY2}.txt)
          P50_NO2=$(get_p50 wrk_noscale_c${CONCURRENCY2}.txt)
          P90_NO2=$(get_p90 wrk_noscale_c${CONCURRENCY2}.txt)
          TO_NO2=$(get_timeouts wrk_noscale_c${CONCURRENCY2}.txt)

          cat > cml_report.md <<'EOF'
          # 📊 Iris API – Deploy, Autoscaling & Load Test Report

          **Image:** `${IMAGE_URI}:${IMG_TAG}`  
          **Service IP:** `${SERVICE_IP}`  
          **Test duration:** `${DURATION}`  
          **Namespace:** `${{ env.NAMESPACE }}`

          ## ✅ Autoscaling Enabled (min=1, max=3), Concurrency `${CONCURRENCY1}`
          | Metric | Value |
          |---|---|
          | Requests/sec | ${RPS_AUTO} |
          | P50 latency | ${P50_AUTO} |
          | P90 latency | ${P90_AUTO} |
          | Timeouts | ${TO_AUTO:-0} |

          <details>
          <summary>HPA & Pods after autoscale run</summary>

          **HPA:**
          ```text
          $(cat hpa_after_autoscale.txt)
          ```

          **Pods:**
          ```text
          $(cat pods_after_autoscale.txt)
          ```
          </details>

          ## 🚫 Autoscaling Restricted (min=1, max=1)
          **Concurrency `${CONCURRENCY1}`**
          | Metric | Value |
          |---|---|
          | Requests/sec | ${RPS_NO1} |
          | P50 latency | ${P50_NO1} |
          | P90 latency | ${P90_NO1} |
          | Timeouts | ${TO_NO1:-0} |

          <details>
          <summary>HPA & Pods after no-scale c=${CONCURRENCY1}</summary>

          **HPA:**
          ```text
          $(cat hpa_after_noscale_c${CONCURRENCY1}.txt)
          ```

          **Pods:**
          ```text
          $(cat pods_after_noscale_c${CONCURRENCY1}.txt)
          ```
          </details>

          **Concurrency `${CONCURRENCY2}`**
          | Metric | Value |
          |---|---|
          | Requests/sec | ${RPS_NO2} |
          | P50 latency | ${P50_NO2} |
          | P90 latency | ${P90_NO2} |
          | Timeouts | ${TO_NO2:-0} |

          <details>
          <summary>HPA & Pods after no-scale c=${CONCURRENCY2}</summary>

          **HPA:**
          ```text
          $(cat hpa_after_noscale_c${CONCURRENCY2}.txt)
          ```

          **Pods:**
          ```text
          $(cat pods_after_noscale_c${CONCURRENCY2}.txt)
          ```
          </details>

          ---
          _Published by GitHub Actions + CML._
          EOF

          echo "report_path=cml_report.md" >> $GITHUB_OUTPUT

      # Publish to PR (comment)
      - name: Publish CML report to PR
        if: ${{ github.event_name == 'pull_request' }}
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx cml comment create --pr --publish "${{ steps.cmlreport.outputs.report_path }}"

      # Publish to commit (non-PR)
      - name: Publish CML report to commit
        if: ${{ github.event_name != 'pull_request' }}
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx cml comment create --publish "${{ steps.cmlreport.outputs.report_path }}"

      # Still upload raw outputs as artifacts
      - name: Upload raw outputs
        uses: actions/upload-artifact@v4
        with:
          name: wrk-and-k8s-raw
          path: |
            wrk_autoscale.txt
            wrk_noscale_c${{ github.event.inputs.conc1 || '1000' }}.txt
            wrk_noscale_c${{ github.event.inputs.conc2 || '2000' }}.txt
            hpa_after_*.txt
            pods_after_*.txt
